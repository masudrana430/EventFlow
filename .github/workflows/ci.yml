name: EventFlow CI

on:
  push:
    branches:
      - main
      - feature/complete-eventflow-backend
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Verify API contract
        run: npm run verify:api-contract

      - name: TypeScript build
        run: npm run build

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eventflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eventflow_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/eventflow_ci
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Apply migrations from empty database
        run: npx prisma migrate deploy

  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eventflow_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eventflow_smoke
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/eventflow_smoke
      REDIS_URL: redis://localhost:6379
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:5000
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      QR_SECRET: ci-qr-secret-at-least-32-characters-long
      BCRYPT_SALT_ROUNDS: 4
      SUPER_ADMIN_NAME: EventFlow CI Super Admin
      SUPER_ADMIN_EMAIL: superadmin-ci@eventflow.test
      SUPER_ADMIN_PASSWORD: SuperAdmin@123
      TESTER_ADMIN_NAME: EventFlow CI Admin
      TESTER_ADMIN_EMAIL: admin-ci@eventflow.test
      TESTER_ADMIN_PASSWORD: Admin@123
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 2525
      SMTP_USER: ci
      SMTP_PASSWORD: ci
      EMAIL_SENDER: eventflow-ci@example.com
      UDDOKTAPAY_BASE_URL: http://127.0.0.1:7777
      UDDOKTAPAY_API_KEY: ci-uddoktapay-key
      RESERVATION_MINUTES: 10
      SERVICE_FEE_PERCENT: 5
      PLATFORM_COMMISSION_PERCENT: 10
      PAYOUT_HOLD_DAYS: 7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Start mock UddoktaPay
        run: |
          nohup node -e 'const http=require("http"); http.createServer((req,res)=>{let body=""; req.on("data",c=>body+=c); req.on("end",()=>{res.writeHead(200,{"content-type":"application/json"}); if(req.url==="/api/verify-payment"){res.end(JSON.stringify({status:"PENDING",invoice_id:"ci-invoice",amount:"0",metadata:{}}));} else if(req.url==="/api/checkout-v2"){res.end(JSON.stringify({status:true,payment_url:"http://127.0.0.1:7777/pay/ci",invoice_id:"ci-invoice"}));} else {res.end(JSON.stringify({status:false}));}})}).listen(7777);' > /tmp/uddoktapay.log 2>&1 &

      - name: Start EventFlow
        run: |
          nohup npm start > /tmp/eventflow.log 2>&1 &
          echo $! > /tmp/eventflow.pid

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/eventflow.log
          exit 1

      - name: Smoke every mounted API route
        run: npm run test:api-routes

      - name: Smoke public APIs
        run: |
          curl -fsS http://127.0.0.1:5000/ | grep -q "Welcome to EventFlow Backend"
          curl -fsS http://127.0.0.1:5000/api-docs.json | grep -q "\"EventFlow API\""
          curl -fsS http://127.0.0.1:5000/api/v1/categories/public >/dev/null
          curl -fsS http://127.0.0.1:5000/api/v1/events/public >/dev/null

      - name: Smoke authenticated APIs
        run: |
          LOGIN_RESPONSE=$(curl -fsS \
            -H "Content-Type: application/json" \
            -d '{"email":"admin-ci@eventflow.test","password":"Admin@123"}' \
            http://127.0.0.1:5000/api/v1/auth/login)

          ACCESS_TOKEN=$(echo "$LOGIN_RESPONSE" | jq -r '.data.accessToken')
          test -n "$ACCESS_TOKEN"
          test "$ACCESS_TOKEN" != "null"

          curl -fsS \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            http://127.0.0.1:5000/api/v1/auth/me >/dev/null

          curl -fsS \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            http://127.0.0.1:5000/api/v1/categories >/dev/null

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/eventflow.log || true
