name: Generate EventFlow Migration

on:
  push:
    branches:
      - feature/complete-eventflow-backend

permissions:
  contents: write

jobs:
  generate-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eventflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eventflow_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/eventflow_ci
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-eventflow-backend

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      - name: Generate migration if missing
        shell: bash
        run: |
          set -euo pipefail
          TARGET="prisma/migrations/20260920_complete_eventflow_backend/migration.sql"
          TEMP_SQL="/tmp/eventflow-migration.sql"

          if [ -f "$TARGET" ]; then
            echo "Migration already exists; nothing to generate."
            exit 0
          fi

          npx prisma migrate diff             --from-migrations prisma/migrations             --to-schema prisma/schema             --script             --output "$TEMP_SQL"

          if [ ! -s "$TEMP_SQL" ]; then
            echo "Generated migration was empty."
            exit 1
          fi

          mkdir -p "$(dirname "$TARGET")"
          cp "$TEMP_SQL" "$TARGET"

          git config user.name "EventFlow CI"
          git config user.email "actions@users.noreply.github.com"
          git add "$TARGET"
          git commit -m "chore: add complete EventFlow database migration"
          git push origin HEAD:feature/complete-eventflow-backend
